<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>门票收银与数据管理系统</title>
    <!-- 引入 Chart.js 用于图表绘制 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 复古纸张与木质暖色调主题 (Vintage / Retro Palette) */
        :root {
            --bg-color: #f4efe6;
            --card-bg: #fcf9f2;
            --primary-color: #8c2d19; /* 经典复古红/红棕 */
            --primary-hover: #6e2212;
            --accent-color: #d99b26; /* 复古黄/金黄 */
            --border-color: #d1c7b7;
            --text-color: #3b3228;
            --text-light: #706354;
            --shadow: 0 4px 10px rgba(60, 45, 30, 0.08);
            --danger-color: #c0392b;
            --edit-color: #2980b9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', serif, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            max-width: 1100px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* 顶部状态栏 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .header-left .date-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .header-left .time-display {
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .header-right {
            display: flex;
            gap: 20px;
            text-align: right;
        }

        .stat-box {
            background: #f3ede2;
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* 卡片通用样式 */
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 表单布局 */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-color);
        }

        select, input {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: #fff;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
        }

        .custom-input {
            margin-top: 5px;
            display: none;
        }

        /* 门票与附加服务区块 */
        .ticket-box {
            border: 1px dashed var(--border-color);
            padding: 12px;
            border-radius: 6px;
            background-color: #fcf6ed;
            margin-bottom: 15px;
        }

        .ticket-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .ticket-row:last-child {
            margin-bottom: 0;
        }

        .ticket-type-label {
            width: 110px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* 按钮与汇总 */
        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .total-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: #fff;
            padding: 8px 18px;
            border: none;
            border-radius: 5px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-edit { background-color: var(--edit-color); font-weight: normal; padding: 4px 10px; font-size: 0.85rem;}
        .btn-edit:hover { background-color: #1f6391; }
        .btn-danger { background-color: var(--danger-color); font-weight: normal; padding: 4px 10px; font-size: 0.85rem;}
        .btn-danger:hover { background-color: #962d22; }

        .btn-xs {
            padding: 2px 6px;
            font-size: 0.72rem;
            border-radius: 3px;
        }

        /* 表格样式 */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #eee7da;
            color: var(--primary-color);
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f7f3eb;
        }

        /* 切换标签页 */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 8px 18px;
            background: #e2d9ca;
            border: 1px solid var(--border-color);
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-color);
        }

        .tab-btn.active {
            background: var(--card-bg);
            border-bottom: 2px solid var(--card-bg);
            color: var(--primary-color);
        }

        /* 日历样式设计 */
        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day-head {
            text-align: center;
            font-weight: bold;
            padding: 8px;
            background: #eee7da;
            border-radius: 4px;
            color: var(--primary-color);
        }

        .calendar-day {
            min-height: 105px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .calendar-day:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .calendar-day.today {
            border: 2px solid var(--accent-color);
            background-color: #fffdf7;
        }

        .calendar-day .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-day .day-num {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .calendar-day .day-revenue {
            font-size: 0.72rem;
            font-weight: bold;
            color: var(--primary-color);
            background-color: #fcf6ed;
            padding: 2px 4px;
            border-radius: 3px;
            text-align: right;
            margin-top: 2px;
            line-height: 1.2;
        }

        .calendar-day .day-guests {
            font-size: 0.75rem;
            color: var(--text-light);
            text-align: right;
        }

        /* 日历单元格右下角操作按钮区域 */
        .day-actions {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 4px;
            border-top: 1px dashed #efe9dd;
            padding-top: 4px;
        }

        /* 图表布局 */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .chart-box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* 模态框 (修改/历史列表/补录) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 95%;
            max-width: 650px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        /* 打印样式控制 */
        @media print {
            body { background: white; color: black; padding: 0; }
            header, .card:first-of-type, .nav-tabs, .btn, .no-print, .charts-container, .calendar-controls {
                display: none !important;
            }
            .card { border: none; box-shadow: none; padding: 0; }
            table { border: 1px solid #000; }
            th, td { border: 1px solid #000; }
        }
    </style>
</head>
<body>

    <!-- 顶部状态栏 -->
    <header>
        <div class="header-left">
            <span class="date-display" id="currentDate">----年--月--日</span>
            <span class="time-display" id="currentTime">00:00:00</span>
        </div>
        <div class="header-right">
            <div class="stat-box">
                <div class="stat-label">今日总结算人数</div>
                <div class="stat-value" id="headerTotalGuests">0 人</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">今日总结算收入</div>
                <div class="stat-value" id="headerTotalRevenue">RM 0.00 / RMB 0.00</div>
            </div>
        </div>
    </header>

    <!-- 录入表单 -->
    <div class="card">
        <div class="card-title">🎟️ 门票收款录入</div>
        
        <form id="ticketForm" onsubmit="handleFormSubmit(event)">
            <!-- 门票与附加服务组合区域 -->
            <div class="ticket-box">
                <label style="margin-bottom: 10px; display: block;">设置门票数量与价格：</label>
                
                <!-- 成人票 -->
                <div class="ticket-row">
                    <span class="ticket-type-label">👨 成人票：</span>
                    <select id="adultQtySelect" onchange="toggleCustomQty('adultQtySelect', 'adultCustomQty')">
                        <option value="0">0 人</option>
                        <option value="1">1 人</option>
                        <option value="2">2 人</option>
                        <option value="3">3 人</option>
                        <option value="4">4 人</option>
                        <option value="5">5 人</option>
                        <option value="6">6 人</option>
                        <option value="7">7 人</option>
                        <option value="8">8 人</option>
                        <option value="9">9 人</option>
                        <option value="10">10 人</option>
                        <option value="custom">自定义人数...</option>
                    </select>
                    <input type="number" id="adultCustomQty" class="custom-input" placeholder="1-100" min="1" max="100" style="width: 90px;">
                    
                    <span style="margin-left: 10px;">单价：</span>
                    <select id="adultPriceSelect">
                        <option value="RM35">RM35 / RMB60</option>
                    </select>
                </div>

                <!-- 儿童票 -->
                <div class="ticket-row">
                    <span class="ticket-type-label">🧒 儿童票：</span>
                    <select id="childQtySelect" onchange="toggleCustomQty('childQtySelect', 'childCustomQty')">
                        <option value="0">0 人</option>
                        <option value="1">1 人</option>
                        <option value="2">2 人</option>
                        <option value="3">3 人</option>
                        <option value="4">4 人</option>
                        <option value="5">5 人</option>
                        <option value="6">6 人</option>
                        <option value="7">7 人</option>
                        <option value="8">8 人</option>
                        <option value="9">9 人</option>
                        <option value="10">10 人</option>
                        <option value="custom">自定义人数...</option>
                    </select>
                    <input type="number" id="childCustomQty" class="custom-input" placeholder="1-100" min="1" max="100" style="width: 90px;">
                    
                    <span style="margin-left: 10px;">单价：</span>
                    <select id="childPriceSelect">
                        <option value="RM20">RM20 / RMB35</option>
                    </select>
                </div>

                <!-- 导览服务（勾选项） -->
                <div class="ticket-row" style="margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--border-color);">
                    <span class="ticket-type-label">🚩 附加服务：</span>
                    <label class="checkbox-label">
                        <input type="checkbox" id="guideServiceCheck" onchange="calculateFormTotal()">
                        <span>勾选导览 (RM 30 / RMB 50)</span>
                    </label>
                </div>
            </div>

            <div class="form-grid">
                <!-- 付款方式 -->
                <div class="form-group">
                    <label>💳 付款方式：</label>
                    <select id="paymentMethod" required>
                        <option value="现金">💵 现金</option>
                        <option value="Touch 'n Go (TnG)">📱 Touch 'n Go</option>
                        <option value="支付宝">📱 支付宝</option>
                        <option value="微信支付">📱 微信支付</option>
                    </select>
                </div>
            </div>

            <!-- 底部汇总提交 -->
            <div class="summary-bar">
                <div>
                    <span>总人数：<b id="formTotalCount">0</b> 人 | </span>
                    <span class="total-display">应收金额：RM <span id="formTotalPriceRM">0.00</span> / RMB <span id="formTotalPriceRMB">0.00</span></span>
                </div>
                <button type="submit" class="btn">确认提交</button>
            </div>
        </form>
    </div>

    <!-- 选项卡切换 -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tabToday" onclick="switchTab('today')">📋 今日记录与管理</button>
        <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">📅 历史记录日历与统计</button>
    </div>

    <!-- 视图 1：今日记录表格视图 -->
    <div id="todayView" class="card">
        <div class="card-title">
            <span id="tableTitle">今日售票记录</span>
            <button class="btn btn-secondary no-print" onclick="window.print()">🖨️ 打印当前记录表</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>日期时间</th>
                        <th>总人数</th>
                        <th>收费明细</th>
                        <th>付款方式</th>
                        <th>总价格</th>
                        <th class="no-print">操作</th>
                    </tr>
                </thead>
                <tbody id="recordsTableBody">
                    <!-- 动态生成数据行 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 视图 2：历史日历与图表视图 -->
    <div id="historyView" style="display: none;">
        <!-- 日历卡片 -->
        <div class="card">
            <div class="calendar-controls">
                <button class="btn btn-secondary" onclick="changeMonth(-1)">◀ 上个月</button>
                <h3 id="calendarMonthTitle" style="color: var(--primary-color);">----年 --月</h3>
                <button class="btn btn-secondary" onclick="changeMonth(1)">下个月 ▶</button>
            </div>
            
            <div class="calendar-grid">
                <div class="calendar-day-head">日</div>
                <div class="calendar-day-head">一</div>
                <div class="calendar-day-head">二</div>
                <div class="calendar-day-head">三</div>
                <div class="calendar-day-head">四</div>
                <div class="calendar-day-head">五</div>
                <div class="calendar-day-head">六</div>
            </div>
            <div class="calendar-grid" id="calendarDays" style="margin-top: 8px;">
                <!-- 日历格子由 JS 生成 -->
            </div>
        </div>

        <!-- 数据可视化图表区域 -->
        <div class="card">
            <div class="card-title">📊 本月数据可视化分析</div>
            <div class="charts-container">
                <div class="chart-box">
                    <h4 style="text-align: center; margin-bottom: 10px; color: var(--text-light);">每日收益趋势 (RMB 换算总计)</h4>
                    <canvas id="revenueChart"></canvas>
                </div>
                <div class="chart-box">
                    <h4 style="text-align: center; margin-bottom: 10px; color: var(--text-light);">当天时间段分布图 (24小时分布)</h4>
                    <canvas id="timeChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗 1：某一天历史明细列表 Modal -->
    <div class="modal" id="dayDetailsModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px;">
                <h3 style="color: var(--primary-color);" id="dayDetailsTitle">📅 历史记录明细</h3>
                <button class="btn btn-edit btn-xs" onclick="openAddModalForDate()">➕ 补录此日数据</button>
            </div>
            <div id="dayDetailsList" class="table-wrapper">
                <!-- 动态渲染某天的表格列表 -->
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 15px;">
                <button type="button" class="btn btn-secondary" onclick="closeDayDetailsModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 弹窗 2：修改/补录数据 Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 style="color: var(--primary-color); margin-bottom: 15px;" id="editModalTitle">✏️ 修改/补录记录</h3>
            <form id="editForm" onsubmit="saveEditRecord(event)">
                <input type="hidden" id="editRecordId">
                
                <!-- 时间调整 -->
                <div class="form-grid" style="margin-bottom: 10px;">
                    <div class="form-group">
                        <label>📅 更改日期：</label>
                        <input type="date" id="editDate" required>
                    </div>
                    <div class="form-group">
                        <label>⏰ 更改时间：</label>
                        <input type="time" id="editTime" step="1" required>
                    </div>
                </div>

                <div class="form-grid" style="margin-bottom: 10px;">
                    <div class="form-group">
                        <label>👨 成人票人数：</label>
                        <input type="number" id="editAdultCount" min="0" required onchange="calculateEditTotal()">
                    </div>
                    <div class="form-group">
                        <label>🧒 儿童票人数：</label>
                        <input type="number" id="editChildCount" min="0" required onchange="calculateEditTotal()">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 10px;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="editGuideCheck" onchange="calculateEditTotal()">
                        <span>🚩 包含导览服务 (RM 30 / RMB 50)</span>
                    </label>
                </div>

                <div class="form-group" style="margin-bottom: 10px;">
                    <label>💳 付款方式：</label>
                    <select id="editPaymentMethod">
                        <option value="现金">💵 现金</option>
                        <option value="Touch 'n Go (TnG)">📱 Touch 'n Go</option>
                        <option value="支付宝">📱 支付宝</option>
                        <option value="微信支付">📱 微信支付</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label>💰 显示总价格：</label>
                    <input type="text" id="editTotalPrice" required placeholder="如: RM35 / RMB60">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">取消</button>
                    <button type="submit" class="btn">保存更改</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allRecords = [];
        let currentTab = 'today';
        let calendarDate = new Date();
        let selectedCalendarDateStr = '';

        let revenueChartInstance = null;
        let timeChartInstance = null;

        // 初始化时间
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('currentDate').innerText = `${year}年${month}月${day}日`;
            document.getElementById('currentTime').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleCustomQty(selectId, inputId) {
            const select = document.getElementById(selectId);
            const input = document.getElementById(inputId);
            if (select.value === 'custom') {
                input.style.display = 'inline-block';
                input.required = true;
            } else {
                input.style.display = 'none';
                input.required = false;
            }
            calculateFormTotal();
        }

        // 计算表单实时总价与人数（含导览选项：固定 RM30 = RMB50）
        function getTicketValues() {
            let adultQtySelect = document.getElementById('adultQtySelect').value;
            let adultQty = adultQtySelect === 'custom' ? parseInt(document.getElementById('adultCustomQty').value || 0) : parseInt(adultQtySelect);

            let childQtySelect = document.getElementById('childQtySelect').value;
            let childQty = childQtySelect === 'custom' ? parseInt(document.getElementById('childCustomQty').value || 0) : parseInt(childQtySelect);

            let hasGuide = document.getElementById('guideServiceCheck').checked;

            let totalCount = adultQty + childQty;

            // 固定基础价格
            let totalPriceRM = (adultQty * 35) + (childQty * 20);
            let totalPriceRMB = (adultQty * 60) + (childQty * 35);

            // 加上导览服务 RM30 / RMB50
            if (hasGuide) {
                totalPriceRM += 30;
                totalPriceRMB += 50;
            }

            let detailsArr = [];
            if (adultQty > 0) detailsArr.push(`成人票 x${adultQty}`);
            if (childQty > 0) detailsArr.push(`儿童票 x${childQty}`);
            if (hasGuide) detailsArr.push(`导览服务`);

            return {
                adultQty,
                childQty,
                hasGuide,
                totalCount,
                totalPriceRM,
                totalPriceRMB,
                details: detailsArr.join(', ') || '无门票'
            };
        }

        function calculateFormTotal() {
            const data = getTicketValues();
            document.getElementById('formTotalCount').innerText = data.totalCount;
            document.getElementById('formTotalPriceRM').innerText = data.totalPriceRM.toFixed(2);
            document.getElementById('formTotalPriceRMB').innerText = data.totalPriceRMB.toFixed(2);
        }

        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('input', calculateFormTotal);
            element.addEventListener('change', calculateFormTotal);
        });

        // 提交表单数据
        async function handleFormSubmit(e) {
            e.preventDefault();
            const ticketData = getTicketValues();

            if (ticketData.totalCount <= 0 && !ticketData.hasGuide) {
                alert('请选择门票人数或勾选导览服务！');
                return;
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            const timeStr = now.toTimeString().split(' ')[0];

            let displayPriceStr = `RM${ticketData.totalPriceRM} / RMB${ticketData.totalPriceRMB}`;

            const payload = {
                id: Date.now().toString(),
                date: dateStr,
                time: timeStr,
                adultCount: ticketData.adultQty,
                childCount: ticketData.childQty,
                hasGuide: ticketData.hasGuide,
                totalCount: ticketData.totalCount,
                paymentMethod: document.getElementById('paymentMethod').value,
                totalPrice: ticketData.totalPriceRM,
                totalPriceRM: ticketData.totalPriceRM,
                totalPriceRMB: ticketData.totalPriceRMB,
                convertedRMB: ticketData.totalPriceRMB,
                displayPrice: displayPriceStr,
                details: ticketData.details
            };

            try {
                const res = await fetch('/api/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    document.getElementById('ticketForm').reset();
                    document.getElementById('adultCustomQty').style.display = 'none';
                    document.getElementById('childCustomQty').style.display = 'none';
                    calculateFormTotal();
                    fetchRecords();
                } else {
                    alert('提交失败，请重试');
                }
            } catch (err) {
                alert('网络连接失败，请检查服务器是否正常运行');
            }
        }

        async function deleteRecord(id) {
            if (!confirm("确定要删除这条记录吗？此操作无法撤销。")) return;

            try {
                const res = await fetch(`/api/records/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchRecords();
                    if (selectedCalendarDateStr) {
                        openDayDetailsModal(selectedCalendarDateStr);
                    }
                } else {
                    alert('删除失败');
                }
            } catch (e) {
                alert('网络错误，删除失败');
            }
        }

        // 打开编辑模式（可改日期和具体时间）
        function openEditModal(id) {
            const record = allRecords.find(r => r.id == id);
            if (!record) return;

            document.getElementById('editModalTitle').innerText = '✏️ 修改历史售票记录';
            document.getElementById('editRecordId').value = record.id;
            document.getElementById('editDate').value = record.date;
            document.getElementById('editTime').value = record.time || '12:00:00';
            document.getElementById('editAdultCount').value = record.adultCount || 0;
            document.getElementById('editChildCount').value = record.childCount || 0;
            document.getElementById('editGuideCheck').checked = !!record.hasGuide;
            document.getElementById('editPaymentMethod').value = record.paymentMethod;
            document.getElementById('editTotalPrice').value = record.displayPrice || `RM${record.totalPrice}`;

            document.getElementById('editModal').style.display = 'flex';
        }

        // 为特定日期开启【补录】弹窗
        function openAddModalForDate(dateStr) {
            const targetDate = dateStr || selectedCalendarDateStr || new Date().toISOString().split('T')[0];
            const nowTime = new Date().toTimeString().split(' ')[0];

            document.getElementById('editModalTitle').innerText = `➕ 补录历史记录 (${targetDate})`;
            document.getElementById('editRecordId').value = ''; // 空 ID 表示新建
            document.getElementById('editDate').value = targetDate;
            document.getElementById('editTime').value = nowTime;
            document.getElementById('editAdultCount').value = 1;
            document.getElementById('editChildCount').value = 0;
            document.getElementById('editGuideCheck').checked = false;
            document.getElementById('editPaymentMethod').value = '现金';
            
            calculateEditTotal();
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function calculateEditTotal() {
            const adult = parseInt(document.getElementById('editAdultCount').value || 0);
            const child = parseInt(document.getElementById('editChildCount').value || 0);
            const hasGuide = document.getElementById('editGuideCheck').checked;

            let estimatedRM = (adult * 35) + (child * 20) + (hasGuide ? 30 : 0);
            let estimatedRMB = (adult * 60) + (child * 35) + (hasGuide ? 50 : 0);
            document.getElementById('editTotalPrice').value = `RM${estimatedRM} / RMB${estimatedRMB}`;
        }

        async function saveEditRecord(e) {
            e.preventDefault();
            const id = document.getElementById('editRecordId').value;
            const newDate = document.getElementById('editDate').value;
            const newTime = document.getElementById('editTime').value;
            const adultCount = parseInt(document.getElementById('editAdultCount').value || 0);
            const childCount = parseInt(document.getElementById('editChildCount').value || 0);
            const hasGuide = document.getElementById('editGuideCheck').checked;
            const priceInput = document.getElementById('editTotalPrice').value;
            const paymentMethod = document.getElementById('editPaymentMethod').value;

            let detailsArr = [];
            if (adultCount > 0) detailsArr.push(`成人票 x${adultCount}`);
            if (childCount > 0) detailsArr.push(`儿童票 x${childCount}`);
            if (hasGuide) detailsArr.push(`导览服务`);

            let calcRM = (adultCount * 35) + (childCount * 20) + (hasGuide ? 30 : 0);
            let calcRMB = (adultCount * 60) + (childCount * 35) + (hasGuide ? 50 : 0);

            const payload = {
                id: id || Date.now().toString(),
                date: newDate,
                time: newTime,
                adultCount,
                childCount,
                hasGuide,
                totalCount: adultCount + childCount,
                totalPrice: calcRM,
                totalPriceRM: calcRM,
                totalPriceRMB: calcRMB,
                convertedRMB: calcRMB,
                displayPrice: priceInput,
                paymentMethod,
                details: detailsArr.join(', ') || '无门票'
            };

            try {
                const url = id ? `/api/records/${id}` : '/api/records';
                const method = id ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeEditModal();
                    await fetchRecords();
                    if (selectedCalendarDateStr) {
                        openDayDetailsModal(selectedCalendarDateStr);
                    }
                } else {
                    alert('保存失败，请重试');
                }
            } catch (e) {
                alert('网络错误，保存失败');
            }
        }

        async function fetchRecords() {
            try {
                const res = await fetch('/api/records');
                allRecords = await res.json();
                renderUI();
            } catch (e) {
                console.error("数据拉取失败", e);
            }
        }

        function getRecordAmounts(r) {
            let adultQty = r.adultCount || 0;
            let childQty = r.childCount || 0;
            let hasGuide = !!r.hasGuide;

            let totalRM = (adultQty * 35) + (childQty * 20) + (hasGuide ? 30 : 0);
            let totalRMB = (adultQty * 60) + (childQty * 35) + (hasGuide ? 50 : 0);

            if (totalRM === 0 && (r.totalPriceRM || r.totalPrice)) {
                totalRM = r.totalPriceRM || r.totalPrice || 0;
                totalRMB = r.totalPriceRMB || r.convertedRMB || 0;
            }

            return { totalRM, totalRMB };
        }

        function renderUI() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            let todayGuests = 0;
            let todayTotalRM = 0;
            let todayTotalRMB = 0;

            const todayRecords = allRecords.filter(r => r.date === todayStr);
            todayRecords.forEach(r => {
                todayGuests += (r.totalCount || 0);
                const amt = getRecordAmounts(r);
                todayTotalRM += amt.totalRM;
                todayTotalRMB += amt.totalRMB;
            });

            document.getElementById('headerTotalGuests').innerText = `${todayGuests} 人`;
            document.getElementById('headerTotalRevenue').innerText = `RM ${todayTotalRM.toFixed(2)} / RMB ${todayTotalRMB.toFixed(2)}`;

            if (currentTab === 'today') {
                renderTodayTable(todayRecords);
            } else {
                renderCalendar();
                renderCharts();
            }
        }

        function renderTodayTable(todayRecords) {
            const tbody = document.getElementById('recordsTableBody');
            tbody.innerHTML = '';

            if (todayRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="color: var(--text-light); padding: 20px;">今日暂无记录</td></tr>`;
                return;
            }

            [...todayRecords].reverse().forEach(r => {
                const tr = document.createElement('tr');
                const amt = getRecordAmounts(r);
                let priceText = r.displayPrice || `RM${amt.totalRM} / RMB${amt.totalRMB}`;
                
                tr.innerHTML = `
                    <td>${r.date} ${r.time}</td>
                    <td><b>${r.totalCount}</b> 人</td>
                    <td>${r.details || '-'}</td>
                    <td>${r.paymentMethod}</td>
                    <td><b style="color: var(--primary-color);">${priceText}</b></td>
                    <td class="no-print">
                        <button class="btn btn-edit" onclick="openEditModal('${r.id}')">修改</button>
                        <button class="btn btn-danger" onclick="deleteRecord('${r.id}')">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changeMonth(delta) {
            calendarDate.setMonth(calendarDate.getMonth() + delta);
            renderCalendar();
            renderCharts();
        }

        function renderCalendar() {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            
            document.getElementById('calendarMonthTitle').innerText = `${year}年 ${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const container = document.getElementById('calendarDays');
            container.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day empty';
                container.appendChild(emptyDiv);
            }

            const todayStr = new Date().toISOString().split('T')[0];

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const dayRecords = allRecords.filter(r => r.date === dateStr);
                let dayTotalRM = 0;
                let dayTotalRMB = 0;
                let dayGuests = 0;

                dayRecords.forEach(r => {
                    const amt = getRecordAmounts(r);
                    dayTotalRM += amt.totalRM;
                    dayTotalRMB += amt.totalRMB;
                    dayGuests += (r.totalCount || 0);
                });

                const dayDiv = document.createElement('div');
                dayDiv.className = `calendar-day ${dateStr === todayStr ? 'today' : ''}`;

                dayDiv.innerHTML = `
                    <div class="day-header">
                        <span class="day-num">${day}</span>
                        ${dayGuests > 0 ? `<span class="day-guests">${dayGuests}人</span>` : ''}
                    </div>
                    ${dayRecords.length > 0 ? `
                        <div>
                            <div class="day-revenue">RM ${dayTotalRM.toFixed(0)}</div>
                            <div class="day-revenue">RMB ${dayTotalRMB.toFixed(0)}</div>
                        </div>
                    ` : '<div style="flex:1;"></div>'}
                    <div class="day-actions">
                        <button class="btn btn-edit btn-xs" title="修改此日数据" onclick="openDayDetailsModal('${dateStr}')">✏️ 管理</button>
                        <button class="btn btn-secondary btn-xs" title="补录此日数据" onclick="openAddModalForDate('${dateStr}')">➕ 补录</button>
                    </div>
                `;
                container.appendChild(dayDiv);
            }
        }

        // 打开某天的数据列表弹窗（供修改与管理）
        function openDayDetailsModal(dateStr) {
            selectedCalendarDateStr = dateStr;
            const dayRecords = allRecords.filter(r => r.date === dateStr);
            
            document.getElementById('dayDetailsTitle').innerText = `📅 ${dateStr} 数据明细管理`;
            const container = document.getElementById('dayDetailsList');

            if (dayRecords.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-light); padding: 20px;">该日期暂无售票记录。</p>`;
            } else {
                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>明细</th>
                                <th>付款方式</th>
                                <th>金额</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                dayRecords.forEach(r => {
                    const amt = getRecordAmounts(r);
                    let pStr = r.displayPrice || `RM${amt.totalRM} / RMB${amt.totalRMB}`;
                    html += `
                        <tr>
                            <td>${r.time}</td>
                            <td>${r.details}</td>
                            <td>${r.paymentMethod}</td>
                            <td><b style="color: var(--primary-color);">${pStr}</b></td>
                            <td>
                                <button class="btn btn-edit btn-xs" onclick="openEditModal('${r.id}')">修改/调时</button>
                                <button class="btn btn-danger btn-xs" onclick="deleteRecord('${r.id}')">删除</button>
                            </td>
                        </tr>
                    `;
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            }

            document.getElementById('dayDetailsModal').style.display = 'flex';
        }

        function closeDayDetailsModal() {
            document.getElementById('dayDetailsModal').style.display = 'none';
        }

        function renderCharts() {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const labels = [];
            const revenueData = [];

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                labels.push(`${d}日`);
                
                const dayTotalConverted = allRecords
                    .filter(r => r.date === dateStr)
                    .reduce((sum, r) => sum + getRecordAmounts(r).totalRMB, 0);
                revenueData.push(dayTotalConverted);
            }

            if (revenueChartInstance) revenueChartInstance.destroy();

            const ctx1 = document.getElementById('revenueChart').getContext('2d');
            revenueChartInstance = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '每日收益 (RMB 总计)',
                        data: revenueData,
                        borderColor: '#8c2d19',
                        backgroundColor: 'rgba(140, 45, 25, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });

            const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
            const monthRecords = allRecords.filter(r => r.date && r.date.startsWith(monthPrefix));

            const hourlyRevenue = new Array(24).fill(0);
            monthRecords.forEach(r => {
                if (r.time) {
                    const hour = parseInt(r.time.split(':')[0], 10);
                    if (!isNaN(hour) && hour >= 0 && hour < 24) {
                        hourlyRevenue[hour] += getRecordAmounts(r).totalRMB;
                    }
                }
            });

            const timeLabels = ['00:00', '02:00', '04:00', '06:00', '08:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00', '22:00'];
            const timeData = [];

            for (let i = 0; i < 24; i += 2) {
                const intervalRevenue = hourlyRevenue[i] + hourlyRevenue[i + 1];
                timeData.push(intervalRevenue);
            }

            if (timeChartInstance) timeChartInstance.destroy();

            const ctx2 = document.getElementById('timeChart').getContext('2d');
            timeChartInstance = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: timeLabels,
                    datasets: [{
                        label: '时段收益 (RMB)',
                        data: timeData,
                        backgroundColor: '#d99b26',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { title: { display: true, text: '时间段 (12个显示点)' } },
                        y: { title: { display: true, text: '收益 (RMB)' } }
                    }
                }
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabToday').classList.toggle('active', tab === 'today');
            document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
            
            document.getElementById('todayView').style.display = tab === 'today' ? 'block' : 'none';
            document.getElementById('historyView').style.display = tab === 'history' ? 'block' : 'none';

            renderUI();
        }

        setInterval(fetchRecords, 5000);
        fetchRecords();
    </script>
</body>
</html>
