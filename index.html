<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>门票收银与数据管理系统</title>
    <!-- 引入 Chart.js 用于图表绘制 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* 复古纸张与木质暖色调主题 (Vintage / Retro Palette) */
        :root {
            --bg-color: #f4efe6;
            --card-bg: #fcf9f2;
            --primary-color: #8c2d19; /* 经典复古红/红棕 */
            --primary-hover: #6e2212;
            --accent-color: #d99b26; /* 复古黄/金黄 */
            --border-color: #d1c7b7;
            --text-color: #3b3228;
            --text-light: #706354;
            --shadow: 0 4px 10px rgba(60, 45, 30, 0.08);
            --danger-color: #c0392b;
            --edit-color: #2980b9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', serif, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            max-width: 1050px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* 顶部状态栏 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .header-left .date-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .header-left .time-display {
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat-box {
            background: #f3ede2;
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            text-align: right;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* 卡片通用样式 */
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 表单布局 */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-color);
        }

        select, input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: #fff;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
        }

        .custom-input {
            margin-top: 5px;
            display: none;
        }

        /* 门票与附加服务区块 */
        .ticket-box {
            border: 1px dashed var(--border-color);
            padding: 12px;
            border-radius: 6px;
            background-color: #fcf6ed;
            margin-bottom: 15px;
        }

        .ticket-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .ticket-row:last-child {
            margin-bottom: 0;
        }

        .ticket-type-label {
            width: 110px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* 按钮与汇总 */
        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .total-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: #fff;
            padding: 8px 18px;
            border: none;
            border-radius: 5px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-edit { background-color: var(--edit-color); font-weight: normal; padding: 4px 12px; font-size: 0.85rem;}
        .btn-edit:hover { background-color: #1f6391; }
        .btn-danger { background-color: var(--danger-color); font-weight: normal; padding: 4px 10px; font-size: 0.85rem;}
        .btn-danger:hover { background-color: #962d22; }

        /* 表格样式 */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #eee7da;
            color: var(--primary-color);
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f7f3eb;
        }

        /* 切换标签页 */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 8px 18px;
            background: #e2d9ca;
            border: 1px solid var(--border-color);
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-color);
        }

        .tab-btn.active {
            background: var(--card-bg);
            border-bottom: 2px solid var(--card-bg);
            color: var(--primary-color);
        }

        /* 日历样式设计 */
        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day-head {
            text-align: center;
            font-weight: bold;
            padding: 8px;
            background: #eee7da;
            border-radius: 4px;
            color: var(--primary-color);
        }

        .calendar-day {
            min-height: 105px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .calendar-day:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
        }

        .calendar-day.today {
            border: 2px solid var(--accent-color);
            background-color: #fffdf7;
        }

        .calendar-day .day-num {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .calendar-day .day-revenue {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--primary-color);
            background-color: #fcf6ed;
            padding: 1px 3px;
            border-radius: 3px;
            text-align: right;
            margin-top: 1px;
            line-height: 1.1;
        }

        .calendar-day .day-guests {
            font-size: 0.72rem;
            color: var(--text-light);
            text-align: right;
        }

        .btn-day-edit {
            background-color: #f0f0f0;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            font-size: 0.7rem;
            padding: 2px 4px;
            margin-top: 4px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-day-edit:hover {
            background-color: var(--edit-color);
            color: #fff;
            border-color: var(--edit-color);
        }

        /* 图表布局 */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .chart-box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* 模态框统一设计 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 95%;
            max-width: 680px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        .history-list-item {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .history-list-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        @media print {
            body { background: white; color: black; padding: 0; }
            header, .card:first-of-type, .nav-tabs, .btn, .no-print, .charts-container, .calendar-controls {
                display: none !important;
            }
            .card { border: none; box-shadow: none; padding: 0; }
            table { border: 1px solid #000; }
            th, td { border: 1px solid #000; }
        }
    </style>
</head>
<body>

    <!-- 顶部状态栏 -->
    <header>
        <div class="header-left">
            <span class="date-display" id="currentDate">----年--月--日</span>
            <span class="time-display" id="currentTime">00:00:00</span>
        </div>
        <div class="header-right">
            <div class="stat-box">
                <div class="stat-label">今日总结算人数</div>
                <div class="stat-value" id="headerTotalGuests">0 人</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">今日总结算收入</div>
                <div class="stat-value" id="headerTotalRevenue">RM 0.00 / RMB 0.00</div>
            </div>
        </div>
    </header>

    <!-- 录入表单 -->
    <div class="card">
        <div class="card-title">🎟️ 门票收款录入</div>
        
        <form id="ticketForm" onsubmit="handleFormSubmit(event)">
            <div class="ticket-box">
                <label style="margin-bottom: 10px; display: block;">设置门票数量与价格：</label>
                
                <!-- 成人票 -->
                <div class="ticket-row">
                    <span class="ticket-type-label">👨 成人票：</span>
                    <select id="adultQtySelect" onchange="toggleCustomQty('adultQtySelect', 'adultCustomQty')">
                        <option value="0">0 人</option>
                        <option value="1">1 人</option>
                        <option value="2">2 人</option>
                        <option value="3">3 人</option>
                        <option value="4">4 人</option>
                        <option value="5">5 人</option>
                        <option value="6">6 人</option>
                        <option value="7">7 人</option>
                        <option value="8">8 人</option>
                        <option value="9">9 人</option>
                        <option value="10">10 人</option>
                        <option value="custom">自定义人数...</option>
                    </select>
                    <input type="number" id="adultCustomQty" class="custom-input" placeholder="1-100" min="1" max="100" style="width: 90px;">
                    
                    <span style="margin-left: 10px;">单价：</span>
                    <select id="adultPriceSelect">
                        <option value="RM35">RM35 / RMB60</option>
                    </select>
                </div>

                <!-- 儿童票 -->
                <div class="ticket-row">
                    <span class="ticket-type-label">🧒 儿童票：</span>
                    <select id="childQtySelect" onchange="toggleCustomQty('childQtySelect', 'childCustomQty')">
                        <option value="0">0 人</option>
                        <option value="1">1 人</option>
                        <option value="2">2 人</option>
                        <option value="3">3 人</option>
                        <option value="4">4 人</option>
                        <option value="5">5 人</option>
                        <option value="6">6 人</option>
                        <option value="7">7 人</option>
                        <option value="8">8 人</option>
                        <option value="9">9 人</option>
                        <option value="10">10 人</option>
                        <option value="custom">自定义人数...</option>
                    </select>
                    <input type="number" id="childCustomQty" class="custom-input" placeholder="1-100" min="1" max="100" style="width: 90px;">
                    
                    <span style="margin-left: 10px;">单价：</span>
                    <select id="childPriceSelect">
                        <option value="RM20">RM20 / RMB35</option>
                    </select>
                </div>

                <!-- 导览服务（勾选项） -->
                <div class="ticket-row" style="margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--border-color);">
                    <span class="ticket-type-label">🚩 附加服务：</span>
                    <label class="checkbox-label">
                        <input type="checkbox" id="guideServiceCheck" onchange="calculateFormTotal()">
                        <span>勾选导览 (RM 30 / RMB 50)</span>
                    </label>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>💳 付款方式：</label>
                    <select id="paymentMethod" required>
                        <option value="现金">💵 现金</option>
                        <option value="Touch 'n Go (TnG)">📱 Touch 'n Go</option>
                        <option value="支付宝">📱 支付宝</option>
                        <option value="微信支付">📱 微信支付</option>
                    </select>
                </div>
            </div>

            <div class="summary-bar">
                <div>
                    <span>总人数：<b id="formTotalCount">0</b> 人 | </span>
                    <span class="total-display">应收金额：RM <span id="formTotalPriceRM">0.00</span> / RMB <span id="formTotalPriceRMB">0.00</span></span>
                </div>
                <button type="submit" class="btn">确认提交</button>
            </div>
        </form>
    </div>

    <!-- 选项卡切换 -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tabToday" onclick="switchTab('today')">📋 今日记录与管理</button>
        <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">📅 历史记录日历与统计</button>
    </div>

    <!-- 视图 1：今日记录表格视图 -->
    <div id="todayView" class="card">
        <div class="card-title">
            <span id="tableTitle">今日售票记录</span>
            <button class="btn btn-secondary no-print" onclick="window.print()">🖨️ 打印当前记录表</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>日期时间</th>
                        <th>总人数</th>
                        <th>收费明细</th>
                        <th>付款方式</th>
                        <th>总价格</th>
                        <th class="no-print">操作</th>
                    </tr>
                </thead>
                <tbody id="recordsTableBody">
                    <!-- 动态生成数据行 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 视图 2：历史日历与图表视图 -->
    <div id="historyView" style="display: none;">
        <div class="card">
            <div class="calendar-controls">
                <div>
                    <button class="btn btn-secondary" onclick="changeMonth(-1)">◀ 上个月</button>
                    <button class="btn btn-secondary" onclick="changeMonth(1)" style="margin-left: 5px;">下个月 ▶</button>
                </div>
                <h3 id="calendarMonthTitle" style="color: var(--primary-color);">----年 --月</h3>
                
                <div>
                    <button class="btn btn-edit" id="toggleEditModeBtn" onclick="toggleEditMode()">✏️ 修改</button>
                </div>
            </div>
            
            <div class="calendar-grid">
                <div class="calendar-day-head">日</div>
                <div class="calendar-day-head">一</div>
                <div class="calendar-day-head">二</div>
                <div class="calendar-day-head">三</div>
                <div class="calendar-day-head">四</div>
                <div class="calendar-day-head">五</div>
                <div class="calendar-day-head">六</div>
            </div>
            <div class="calendar-grid" id="calendarDays" style="margin-top: 8px;">
                <!-- 日历格子由 JS 生成 -->
            </div>
        </div>

        <div class="card">
            <div class="card-title">📊 本月数据可视化分析</div>
            <div class="charts-container">
                <div class="chart-box">
                    <h4 style="text-align: center; margin-bottom: 10px; color: var(--text-light);">每日收益趋势 (RM/RMB)</h4>
                    <canvas id="revenueChart"></canvas>
                </div>
                <div class="chart-box">
                    <h4 style="text-align: center; margin-bottom: 10px; color: var(--text-light);">当天时间段分布图 (24小时分布)</h4>
                    <canvas id="timeChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗：历史记录管理 -->
    <div class="modal" id="historyManagerModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="color: var(--primary-color);" id="historyModalTitle">📅 记录管理</h3>
                <button class="btn btn-secondary" onclick="closeHistoryManagerModal()">关闭</button>
            </div>

            <input type="hidden" id="historyFilterDate">

            <div style="background: #fcf6ed; padding: 12px; border-radius: 6px; border: 1px dashed var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
                <span id="currentSelectedDateLabel" style="font-weight: bold; color: var(--primary-color);">当前日期: ----</span>
                <button class="btn" onclick="openEditFormForNew()"><span style="font-size:1.1rem;">＋</span> 补充该日记录</button>
            </div>

            <div id="historyListContainer">
                <!-- 动态渲染该日期下的明细列表 -->
            </div>
        </div>
    </div>

    <!-- 弹窗：添加/编辑表单 -->
    <div class="modal" id="editFormModal" style="z-index: 1050;">
        <div class="modal-content" style="max-width: 500px;">
            <h3 style="color: var(--primary-color); margin-bottom: 15px;" id="editFormHeaderTitle">✏️ 修改售票记录</h3>
            <form id="editForm" onsubmit="saveEditRecord(event)">
                <input type="hidden" id="editRecordId">
                
                <div class="form-group" style="margin-bottom: 10px;">
                    <label>确认日期：</label>
                    <input type="date" id="editRecordDate" required>
                </div>
                <div class="form-group" style="margin-bottom: 10px;">
                    <label>调整时间：</label>
                    <input type="time" id="editRecordTime" step="1" required>
                </div>

                <div class="form-group" style="margin-bottom: 10px;">
                    <label>成人票人数：</label>
                    <input type="number" id="editAdultCount" min="0" required onchange="calculateEditTotal()">
                </div>
                <div class="form-group" style="margin-bottom: 10px;">
                    <label>儿童票人数：</label>
                    <input type="number" id="editChildCount" min="0" required onchange="calculateEditTotal()">
                </div>
                <div class="form-group" style="margin-bottom: 10px;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="editGuideCheck" onchange="calculateEditTotal()">
                        <span>包含导览服务 (RM 30 / RMB 50)</span>
                    </label>
                </div>
                <div class="form-group" style="margin-bottom: 10px;">
                    <label>付款方式：</label>
                    <select id="editPaymentMethod">
                        <option value="现金">💵 现金</option>
                        <option value="Touch 'n Go (TnG)">📱 Touch 'n Go</option>
                        <option value="支付宝">📱 支付宝</option>
                        <option value="微信支付">📱 微信支付</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>确认显示金额：</label>
                    <input type="text" id="editTotalPrice" required placeholder="如: RM35 / RMB60">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" class="btn btn-secondary" onclick="closeEditFormModal()">返回列表</button>
                    <button type="submit" class="btn">保存数据</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allRecords = [];
        let currentTab = 'today';
        let calendarDate = new Date();
        let isEditMode = false;

        let revenueChartInstance = null;
        let timeChartInstance = null;

        // 初始化加载数据
        window.addEventListener('DOMContentLoaded', () => {
            loadRecords();
            updateClock();
            setInterval(updateClock, 1000);
            calculateFormTotal();
        });

        function loadRecords() {
            const saved = localStorage.getItem('ticket_records');
            if (saved) {
                try {
                    allRecords = JSON.parse(saved);
                } catch (e) {
                    allRecords = [];
                }
            }
            renderTable();
            updateTodayStats();
        }

        function saveRecords() {
            localStorage.setItem('ticket_records', JSON.stringify(allRecords));
            renderTable();
            updateTodayStats();
            if (currentTab === 'history') {
                renderCalendar();
                renderCharts();
            }
        }

        // 时钟刷新
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('currentDate').innerText = `${year}年${month}月${day}日`;
            document.getElementById('currentTime').innerText = `${hours}:${minutes}:${seconds}`;
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('toggleEditModeBtn');
            if (isEditMode) {
                btn.innerText = '✅ 完成修改';
                btn.style.backgroundColor = '#27ae60';
            } else {
                btn.innerText = '✏️ 修改';
                btn.style.backgroundColor = 'var(--edit-color)';
            }
            renderCalendar();
        }

        function toggleCustomQty(selectId, inputId) {
            const select = document.getElementById(selectId);
            const input = document.getElementById(inputId);
            if (select.value === 'custom') {
                input.style.display = 'inline-block';
                input.required = true;
            } else {
                input.style.display = 'none';
                input.required = false;
            }
            calculateFormTotal();
        }

        // 计算表单实时总价与人数
        function getTicketValues() {
            let adultQtySelect = document.getElementById('adultQtySelect').value;
            let adultQty = adultQtySelect === 'custom' ? parseInt(document.getElementById('adultCustomQty').value || 0) : parseInt(adultQtySelect || 0);

            let childQtySelect = document.getElementById('childQtySelect').value;
            let childQty = childQtySelect === 'custom' ? parseInt(document.getElementById('childCustomQty').value || 0) : parseInt(childQtySelect || 0);

            let hasGuide = document.getElementById('guideServiceCheck').checked;

            let totalCount = adultQty + childQty;

            let totalPriceRM = (adultQty * 35) + (childQty * 20);
            let totalPriceRMB = (adultQty * 60) + (childQty * 35);

            if (hasGuide) {
                totalPriceRM += 30;
                totalPriceRMB += 50;
            }

            let detailsArr = [];
            if (adultQty > 0) detailsArr.push(`成人票 x${adultQty}`);
            if (childQty > 0) detailsArr.push(`儿童票 x${childQty}`);
            if (hasGuide) detailsArr.push(`导览服务`);

            return {
                adultQty,
                childQty,
                hasGuide,
                totalCount,
                totalPriceRM,
                totalPriceRMB,
                details: detailsArr.join(', ') || '无门票'
            };
        }

        function calculateFormTotal() {
            const data = getTicketValues();
            document.getElementById('formTotalCount').innerText = data.totalCount;
            document.getElementById('formTotalPriceRM').innerText = data.totalPriceRM.toFixed(2);
            document.getElementById('formTotalPriceRMB').innerText = data.totalPriceRMB.toFixed(2);
        }

        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('input', calculateFormTotal);
            element.addEventListener('change', calculateFormTotal);
        });

        // 提交新增数据
        function handleFormSubmit(e) {
            e.preventDefault();
            const ticketData = getTicketValues();

            if (ticketData.totalCount <= 0 && !ticketData.hasGuide) {
                alert('请选择门票人数或勾选导览服务！');
                return;
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            const timeStr = now.toTimeString().split(' ')[0];

            let displayPriceStr = `RM${ticketData.totalPriceRM} / RMB${ticketData.totalPriceRMB}`;

            const payload = {
                id: Date.now().toString(),
                date: dateStr,
                time: timeStr,
                adultCount: ticketData.adultQty,
                childCount: ticketData.childQty,
                hasGuide: ticketData.hasGuide,
                totalCount: ticketData.totalCount,
                details: ticketData.details,
                paymentMethod: document.getElementById('paymentMethod').value,
                displayPrice: displayPriceStr,
                totalPriceRM: ticketData.totalPriceRM,
                totalPriceRMB: ticketData.totalPriceRMB
            };

            allRecords.push(payload);
            saveRecords();

            // 重置表单
            document.getElementById('ticketForm').reset();
            document.getElementById('adultCustomQty').style.display = 'none';
            document.getElementById('childCustomQty').style.display = 'none';
            calculateFormTotal();
            alert('录入成功！');
        }

        // 得到今天的日期字符串 YYYY-MM-DD
        function getTodayDateStr() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 渲染今日表格数据
        function renderTable() {
            const tbody = document.getElementById('recordsTableBody');
            tbody.innerHTML = '';

            const todayStr = getTodayDateStr();
            const todayRecords = allRecords.filter(r => r.date === todayStr);

            if (todayRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-light);">今日暂无记录</td></tr>`;
                return;
            }

            todayRecords.slice().reverse().forEach(record => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${record.time}</td>
                    <td><b>${record.totalCount}</b> 人</td>
                    <td>${record.details || '-'}</td>
                    <td>${record.paymentMethod}</td>
                    <td style="color: var(--primary-color); font-weight: bold;">${record.displayPrice}</td>
                    <td class="no-print">
                        <button class="btn btn-edit" onclick="openEditModalForId('${record.id}')">编辑</button>
                        <button class="btn btn-danger" onclick="deleteRecord('${record.id}')">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 刷新顶部统计数字
        function updateTodayStats() {
            const todayStr = getTodayDateStr();
            const todayRecords = allRecords.filter(r => r.date === todayStr);

            let totalGuests = 0;
            let totalRM = 0;
            let totalRMB = 0;

            todayRecords.forEach(r => {
                totalGuests += Number(r.totalCount || 0);
                totalRM += Number(r.totalPriceRM || 0);
                totalRMB += Number(r.totalPriceRMB || 0);
            });

            document.getElementById('headerTotalGuests').innerText = `${totalGuests} 人`;
            document.getElementById('headerTotalRevenue').innerText = `RM ${totalRM.toFixed(2)} / RMB ${totalRMB.toFixed(2)}`;
        }

        // 选项卡切换
        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'today') {
                document.getElementById('todayView').style.display = 'block';
                document.getElementById('historyView').style.display = 'none';
                document.getElementById('tabToday').classList.add('active');
                document.getElementById('tabHistory').classList.remove('active');
            } else {
                document.getElementById('todayView').style.display = 'none';
                document.getElementById('historyView').style.display = 'block';
                document.getElementById('tabToday').classList.remove('active');
                document.getElementById('tabHistory').classList.add('active');
                renderCalendar();
                renderCharts();
            }
        }

        // 渲染日历
        function renderCalendar() {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            document.getElementById('calendarMonthTitle').innerText = `${year}年 ${month + 1}月`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day empty';
                calendarDays.appendChild(emptyDiv);
            }

            const todayStr = getTodayDateStr();

            for (let day = 1; day <= daysInMonth; day++) {
                const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayRecords = allRecords.filter(r => r.date === dayStr);

                let dayGuests = 0;
                let dayRM = 0;
                let dayRMB = 0;
                dayRecords.forEach(r => {
                    dayGuests += Number(r.totalCount || 0);
                    dayRM += Number(r.totalPriceRM || 0);
                    dayRMB += Number(r.totalPriceRMB || 0);
                });

                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                if (dayStr === todayStr) dayDiv.classList.add('today');

                let contentHtml = `
                    <div class="day-num">${day}</div>
                    <div>
                        <div class="day-revenue">RM ${dayRM}</div>
                        <div class="day-revenue">RMB ${dayRMB}</div>
                        <div class="day-guests">${dayGuests} 人</div>
                    </div>
                `;

                if (isEditMode) {
                    contentHtml += `<button class="btn-day-edit" onclick="openHistoryManagerModal('${dayStr}')">管理</button>`;
                } else {
                    dayDiv.onclick = () => openHistoryManagerModal(dayStr);
                    dayDiv.style.cursor = 'pointer';
                }

                dayDiv.innerHTML = contentHtml;
                calendarDays.appendChild(dayDiv);
            }
        }

        function changeMonth(delta) {
            calendarDate.setMonth(calendarDate.getMonth() + delta);
            renderCalendar();
            renderCharts();
        }

        // 打开历史数据管理弹窗
        function openHistoryManagerModal(dateStr) {
            document.getElementById('historyFilterDate').value = dateStr;
            document.getElementById('currentSelectedDateLabel').innerText = `当前日期: ${dateStr}`;
            
            const listContainer = document.getElementById('historyListContainer');
            listContainer.innerHTML = '';

            const dayRecords = allRecords.filter(r => r.date === dateStr);

            if (dayRecords.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-light);">该日期无交易记录</div>`;
            } else {
                dayRecords.forEach(r => {
                    const item = document.createElement('div');
                    item.className = 'history-list-item';
                    item.innerHTML = `
                        <div class="history-list-info">
                            <div><b>时间：</b>${r.time} | <b>人数：</b>${r.totalCount}人</div>
                            <div style="font-size:0.85rem; color:var(--text-light);">明细：${r.details || '-'} (${r.paymentMethod})</div>
                            <div style="color:var(--primary-color); font-weight:bold;">${r.displayPrice}</div>
                        </div>
                        <div>
                            <button class="btn btn-edit" onclick="openEditModalForId('${r.id}')">修改</button>
                            <button class="btn btn-danger" onclick="deleteRecord('${r.id}')">删除</button>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            }

            document.getElementById('historyManagerModal').style.display = 'flex';
        }

        function closeHistoryManagerModal() {
            document.getElementById('historyManagerModal').style.display = 'none';
        }

        // 删除记录
        function deleteRecord(id) {
            if (confirm('确认删除该条记录吗？')) {
                allRecords = allRecords.filter(r => r.id !== id);
                saveRecords();

                const filterDate = document.getElementById('historyFilterDate').value;
                if (filterDate) openHistoryManagerModal(filterDate);
            }
        }

        // 编辑弹窗处理
        function openEditModalForId(id) {
            const record = allRecords.find(r => r.id === id);
            if (!record) return;

            document.getElementById('editRecordId').value = record.id;
            document.getElementById('editRecordDate').value = record.date;
            document.getElementById('editRecordTime').value = record.time;
            document.getElementById('editAdultCount').value = record.adultCount || 0;
            document.getElementById('editChildCount').value = record.childCount || 0;
            document.getElementById('editGuideCheck').checked = !!record.hasGuide;
            document.getElementById('editPaymentMethod').value = record.paymentMethod;
            document.getElementById('editTotalPrice').value = record.displayPrice;

            document.getElementById('editFormHeaderTitle').innerText = '✏️ 修改售票记录';
            document.getElementById('editFormModal').style.display = 'flex';
        }

        function openEditFormForNew() {
            const selectedDate = document.getElementById('historyFilterDate').value || getTodayDateStr();
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];

            document.getElementById('editRecordId').value = '';
            document.getElementById('editRecordDate').value = selectedDate;
            document.getElementById('editRecordTime').value = timeStr;
            document.getElementById('editAdultCount').value = 0;
            document.getElementById('editChildCount').value = 0;
            document.getElementById('editGuideCheck').checked = false;
            document.getElementById('editPaymentMethod').value = '现金';
            document.getElementById('editTotalPrice').value = 'RM0 / RMB0';

            document.getElementById('editFormHeaderTitle').innerText = '＋ 补充历史售票记录';
            document.getElementById('editFormModal').style.display = 'flex';
        }

        function closeEditFormModal() {
            document.getElementById('editFormModal').style.display = 'none';
        }

        function calculateEditTotal() {
            const adult = parseInt(document.getElementById('editAdultCount').value || 0);
            const child = parseInt(document.getElementById('editChildCount').value || 0);
            const hasGuide = document.getElementById('editGuideCheck').checked;

            let rm = (adult * 35) + (child * 20);
            let rmb = (adult * 60) + (child * 35);

            if (hasGuide) {
                rm += 30;
                rmb += 50;
            }

            document.getElementById('editTotalPrice').value = `RM${rm} / RMB${rmb}`;
        }

        function saveEditRecord(e) {
            e.preventDefault();
            const id = document.getElementById('editRecordId').value;
            const date = document.getElementById('editRecordDate').value;
            const time = document.getElementById('editRecordTime').value;
            const adultCount = parseInt(document.getElementById('editAdultCount').value || 0);
            const childCount = parseInt(document.getElementById('editChildCount').value || 0);
            const hasGuide = document.getElementById('editGuideCheck').checked;
            const paymentMethod = document.getElementById('editPaymentMethod').value;
            const displayPrice = document.getElementById('editTotalPrice').value;

            const totalCount = adultCount + childCount;

            let rm = (adultCount * 35) + (childCount * 20) + (hasGuide ? 30 : 0);
            let rmb = (adultCount * 60) + (childCount * 35) + (hasGuide ? 50 : 0);

            let detailsArr = [];
            if (adultCount > 0) detailsArr.push(`成人票 x${adultCount}`);
            if (childCount > 0) detailsArr.push(`儿童票 x${childCount}`);
            if (hasGuide) detailsArr.push(`导览服务`);

            if (id) {
                // 编辑现有
                const idx = allRecords.findIndex(r => r.id === id);
                if (idx !== -1) {
                    allRecords[idx] = {
                        ...allRecords[idx],
                        date, time, adultCount, childCount, hasGuide,
                        totalCount, details: detailsArr.join(', ') || '无门票',
                        paymentMethod, displayPrice,
                        totalPriceRM: rm, totalPriceRMB: rmb
                    };
                }
            } else {
                // 新建补充
                allRecords.push({
                    id: Date.now().toString(),
                    date, time, adultCount, childCount, hasGuide,
                    totalCount, details: detailsArr.join(', ') || '无门票',
                    paymentMethod, displayPrice,
                    totalPriceRM: rm, totalPriceRMB: rmb
                });
            }

            saveRecords();
            closeEditFormModal();

            const filterDate = document.getElementById('historyFilterDate').value;
            if (filterDate) openHistoryManagerModal(filterDate);
        }

        // 图表渲染
        function renderCharts() {
            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const labels = [];
            const revenueDataRM = [];
            const revenueDataRMB = [];

            for (let day = 1; day <= daysInMonth; day++) {
                labels.push(`${day}日`);
                const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayRecords = allRecords.filter(r => r.date === dayStr);

                let dayRM = 0, dayRMB = 0;
                dayRecords.forEach(r => {
                    dayRM += Number(r.totalPriceRM || 0);
                    dayRMB += Number(r.totalPriceRMB || 0);
                });

                revenueDataRM.push(dayRM);
                revenueDataRMB.push(dayRMB);
            }

            // 渲染收益趋势图
            const ctxRev = document.getElementById('revenueChart').getContext('2d');
            if (revenueChartInstance) revenueChartInstance.destroy();

            revenueChartInstance = new Chart(ctxRev, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'RM 收入', data: revenueDataRM, borderColor: '#8c2d19', backgroundColor: 'rgba(140,45,25,0.1)', fill: true },
                        { label: 'RMB 收入', data: revenueDataRMB, borderColor: '#d99b26', backgroundColor: 'rgba(217,155,38,0.1)', fill: true }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // 渲染时间段分布图 (24小时分布)
            const hoursArr = Array.from({ length: 24 }, (_, i) => `${i}:00`);
            const timeDist = new Array(24).fill(0);

            allRecords.forEach(r => {
                if (r.time) {
                    const h = parseInt(r.time.split(':')[0]);
                    if (!isNaN(h) && h >= 0 && h < 24) {
                        timeDist[h] += Number(r.totalCount || 1);
                    }
                }
            });

            const ctxTime = document.getElementById('timeChart').getContext('2d');
            if (timeChartInstance) timeChartInstance.destroy();

            timeChartInstance = new Chart(ctxTime, {
                type: 'bar',
                data: {
                    labels: hoursArr,
                    datasets: [{
                        label: '入园人数分布',
                        data: timeDist,
                        backgroundColor: '#8c2d19'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
